<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 확인 · 마이샵</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
</head>
<body class="bg-slate-100 min-h-screen grid place-items-center px-4">
  <div id="card" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 w-full max-w-md text-center">
    <div id="spinner" class="text-slate-500">
      <div class="text-4xl mb-3">⏳</div>
      결제를 확인하고 있습니다…
    </div>
  </div>

  <script>
    const won = (n) => (Number(n) || 0).toLocaleString('ko-KR') + '원';

    // successUrl 은 hash 없는 실제 경로이므로 파라미터는 location.search 에 그대로 들어온다.
    const q = new URLSearchParams(window.location.search);
    const paymentKey = q.get('paymentKey');
    const orderId = q.get('orderId');
    const amount = q.get('amount');

    const card = document.getElementById('card');

    function renderSuccess(d, alreadyPaid) {
      const when = d.approvedAt ? new Date(d.approvedAt).toLocaleString('ko-KR') : '-';
      card.innerHTML = `
        <div class="text-5xl mb-3">✅</div>
        <h1 class="text-xl font-extrabold text-slate-800">결제가 완료되었습니다</h1>
        ${alreadyPaid ? '<p class="text-xs text-slate-400 mt-1">(이미 승인된 주문입니다)</p>' : ''}
        <div class="mt-5 text-left text-sm bg-slate-50 rounded-xl p-4 space-y-2">
          <div class="flex justify-between"><span class="text-slate-500">주문명</span><span class="font-semibold text-slate-800">${d.orderName || '-'}</span></div>
          <div class="flex justify-between"><span class="text-slate-500">결제금액</span><span class="font-bold text-slate-900">${won(d.amount)}</span></div>
          <div class="flex justify-between"><span class="text-slate-500">결제수단</span><span class="text-slate-700">${d.method || '-'}</span></div>
          <div class="flex justify-between"><span class="text-slate-500">승인시각</span><span class="text-slate-700">${when}</span></div>
          <div class="flex justify-between"><span class="text-slate-500">주문번호</span><span class="text-slate-400 text-xs break-all">${d.orderId || orderId}</span></div>
        </div>
        <div class="mt-5 flex gap-2">
          ${d.receiptUrl ? `<a href="${d.receiptUrl}" target="_blank" class="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-700 font-semibold text-sm hover:bg-slate-50">영수증 보기</a>` : ''}
          <a href="/" class="flex-1 py-2.5 rounded-xl bg-slate-900 text-white font-semibold text-sm hover:bg-slate-800">쇼핑 계속하기</a>
        </div>`;
    }

    function renderError(msg) {
      card.innerHTML = `
        <div class="text-5xl mb-3">⚠️</div>
        <h1 class="text-xl font-extrabold text-slate-800">결제 승인 실패</h1>
        <p class="mt-3 text-sm text-rose-600 bg-rose-50 rounded-lg px-3 py-2">${msg}</p>
        <a href="/" class="mt-5 inline-block w-full py-2.5 rounded-xl bg-slate-900 text-white font-semibold text-sm hover:bg-slate-800">쇼핑으로 돌아가기</a>`;
    }

    (async () => {
      if (!paymentKey || !orderId || amount == null) {
        renderError('결제 정보가 올바르지 않습니다.');
        return;
      }
      try {
        const res = await fetch('/api/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentKey, orderId, amount }),
        });
        const json = await res.json();
        if (json.success) {
          // 승인 성공 후 URL 의 민감 파라미터 정리 (새로고침 재승인 방지)
          window.history.replaceState({}, '', '/success.html');
          renderSuccess(json.data, json.alreadyPaid);
        } else {
          renderError(json.message || '결제 승인에 실패했습니다.');
        }
      } catch (e) {
        renderError('서버에 연결하지 못했습니다.');
      }
    })();
  </script>
</body>
</html>
