<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 실패 · 마이샵</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
</head>
<body class="bg-slate-100 min-h-screen grid place-items-center px-4">
  <div id="card" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 w-full max-w-md text-center"></div>

  <script>
    // failUrl 도 hash 없는 실제 경로이므로 code/message/orderId 는 location.search 에 들어온다.
    const q = new URLSearchParams(window.location.search);
    const code = q.get('code') || 'UNKNOWN';
    const message = q.get('message') || '결제가 취소되었거나 실패했습니다.';
    const orderId = q.get('orderId') || '-';

    document.getElementById('card').innerHTML = `
      <div class="text-5xl mb-3">❌</div>
      <h1 class="text-xl font-extrabold text-slate-800">결제에 실패했습니다</h1>
      <div class="mt-5 text-left text-sm bg-slate-50 rounded-xl p-4 space-y-2">
        <div class="flex justify-between"><span class="text-slate-500">사유</span><span class="text-slate-800 font-semibold">${message}</span></div>
        <div class="flex justify-between"><span class="text-slate-500">에러코드</span><span class="text-slate-700">${code}</span></div>
        <div class="flex justify-between"><span class="text-slate-500">주문번호</span><span class="text-slate-400 text-xs break-all">${orderId}</span></div>
      </div>
      <a href="/" class="mt-5 inline-block w-full py-2.5 rounded-xl bg-slate-900 text-white font-semibold text-sm hover:bg-slate-800">다시 시도하기</a>`;
  </script>
</body>
</html>
